services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      # Keep the database on the volume, not next to the app code. Mounting
      # /app/backend here would shadow the copied source and pin the container
      # to whatever code existed the first time the volume was created.
      DISASTER_DB_PATH: /data/disaster.db
    volumes:
      - disaster_data:/data
    restart: unless-stopped

volumes:
  disaster_data:
