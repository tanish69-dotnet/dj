# Render Blueprint — India Disaster Response Command Center
# Connect repo on Render → New → Blueprint → this file is auto-detected.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: dj-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Override per-city DB if you want persistent disk later:
      # - key: DISASTER_DB_PATH
      #   value: /var/data/disaster.db

  - type: web
    name: dj-frontend
    runtime: static
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point this at your deployed backend URL after first deploy:
      # e.g. https://dj-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false
