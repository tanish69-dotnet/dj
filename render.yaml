# Render Blueprint — India Disaster Response Command Center
#
# Connect the repo on Render -> New -> Blueprint. This file is auto-detected.
#
# Single-service layout: the container built from ./Dockerfile serves both the
# API and the compiled frontend, so there is one URL, no CORS setup, and no
# VITE_API_URL to configure by hand. This is the recommended deploy path.
#
# Blueprint spec: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: dj
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    # Proves the DB was created, seeded and is queryable — a bare "/" would
    # return 200 even if seeding had failed.
    healthCheckPath: /api/dashboard
    autoDeploy: true
    envVars:
      - key: DISASTER_DB_PATH
        value: /data/disaster.db

# For a split static-site + Python API deploy instead, see render-split.yaml.
